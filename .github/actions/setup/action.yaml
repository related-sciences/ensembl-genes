name: "Set up ensembl genes workflow"
description: "Abstract common workflow steps for setting up application dependencies."
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Setup uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      shell: bash
      run: uv sync
